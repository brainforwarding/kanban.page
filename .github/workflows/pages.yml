name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          # the marketing page is the root; the app lives under /app/ so its
          # service worker scopes to /app/ and never touches the landing page
          mkdir -p _site/app
          rsync -a --exclude .git --exclude _site --exclude site \
                --exclude docs --exclude tests --exclude .github \
                --exclude relay --exclude cli --exclude package.json \
                --exclude CNAME --exclude README.md --exclude CLAUDE.md \
                ./ _site/app/
          # Version the shell on what the shell CONTAINS, not on the commit.
          # The browser byte-compares sw.js on every visit, so stamping it with
          # the SHA re-issued "Update available" to every installed board on
          # every push — 8 of the last 12 deploys changed no app file at all.
          # A hash of the shell files themselves means a landing-page or README
          # commit leaves sw.js identical and nobody is prompted; a real app
          # change still updates exactly as before.
          BUILD_ID=$(cd _site/app && cat index.html styles.css core.js i18n.js qr.js app.js \
                       manifest.webmanifest assets/icon.svg assets/icon-192.png \
                       assets/icon-512.png sw.js | sha256sum | cut -c1-12)
          sed -i "s/__BUILD_ID__/${BUILD_ID}/g" _site/app/sw.js
          echo "shell build id: ${BUILD_ID}"
      - name: Stage the landing page (canonical repo only)
        # A fork that enables Pages should publish a working board at its own
        # URL — not a copy of this site's marketing page and tip jar at its root.
        if: github.repository == 'brainforwarding/kanban.page'
        run: |
          cp site/index.html _site/index.html
          cp site/_og/og-kanban-page.png _site/og.png
          # Only what the page actually references — site/_media also holds
          # unused source clips, and nothing under site/ is staged by default.
          mkdir -p _site/media
          cp site/_media/sync-phone.webp site/_media/sync-phone.png _site/media/
          cp CNAME _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
